[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrain"
version = "0.1.0"
description = "LBrain by Metavolve Labs — AI-native engineering memory with the Lair Protocol."
requires-python = ">=3.10"
authors = [{name = "Metavolve Labs, Inc."}]
license = {text = "BSD-3-Clause"}
# Upper bounds cap surprise major upgrades from a clean build. For reproducible /
# supply-chain-safe builds, generate and commit a hash-locked lockfile
# (`pip-compile --generate-hashes` or `uv lock`) and install with --require-hashes.
dependencies = [
    "sqlite-vec>=0.1.6,<0.2",
    "python-frontmatter>=1.1,<2",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "tiktoken>=0.7,<1",
    "rank-bm25>=0.2.2,<0.3",
    "mcp>=1.0,<2",
    "cryptography>=44,<46",  # Tier-2 archive: AES-256-GCM + Argon2id (cryptography 44+ ships Argon2id)
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
arweave = ["arweave-python-client>=1.0,<2"]  # real permaweb writes (Tier-2 arweave transport)

[project.scripts]
lbrain = "lbrain.cli:main"

[tool.setuptools]
packages = ["lbrain"]
