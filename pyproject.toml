[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrain"
version = "0.1.0"
description = "LBrain by Metavolve Labs — AI-native engineering memory with the Lair Protocol."
requires-python = ">=3.10"
authors = [{name = "Metavolve Labs, Inc."}]
license = {text = "BSD-3-Clause"}
# Upper bounds cap surprise major upgrades from a clean build. For reproducible /
# supply-chain-safe builds, generate and commit a hash-locked lockfile
# (`pip-compile --generate-hashes` or `uv lock`) and install with --require-hashes.
dependencies = [
    "sqlite-vec>=0.1.6,<0.2",
    "python-frontmatter>=1.1,<2",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "tiktoken>=0.7,<1",
    "mcp>=1.0,<2",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
# Tier-2 encrypted archive (lbrain.archive). cryptography (AES-256-GCM + Argon2id,
# 44+ ships Argon2id) gates the whole optional subpackage: without it, the archive
# CLI commands and the lair_deep_recall MCP tool simply don't register.
archive = ["cryptography>=44,<46"]
# …plus real permaweb writes via the Arweave L1 transport.
arweave = ["cryptography>=44,<46", "arweave-python-client>=1.0,<2"]
# Call-when-needed cross-encoder reranker (search(..., rerank=True)). ONNX, no torch.
# sentence-transformers also works as a fallback if already installed.
rerank = ["fastembed>=0.3,<1"]

[project.scripts]
lbrain = "lbrain.cli:main"

[tool.setuptools]
packages = ["lbrain", "lbrain.archive"]
