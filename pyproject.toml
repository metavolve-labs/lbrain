[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrain"
version = "0.1.9"
description = "LBrain by Metavolve Labs — AI-native engineering memory with the Lair Protocol."
requires-python = ">=3.10"
authors = [{name = "Metavolve Labs, Inc."}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
keywords = ["ai", "llm", "memory", "rag", "mcp", "agents", "retrieval", "local-first"]
# Upper bounds cap surprise major upgrades from a clean build. For reproducible /
# supply-chain-safe builds, generate and commit a hash-locked lockfile
# (`pip-compile --generate-hashes` or `uv lock`) and install with --require-hashes.
dependencies = [
    "sqlite-vec>=0.1.6,<0.2",
    "python-frontmatter>=1.1,<2",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "tiktoken>=0.7,<1",
    "mcp>=1.0,<2",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
# Tier-2 encrypted archive (lbrain.archive). cryptography (AES-256-GCM + Argon2id,
# 44+ ships Argon2id) gates the whole optional subpackage: without it, the archive
# CLI commands and the lair_deep_recall MCP tool simply don't register.
archive = ["cryptography>=44,<46"]
# …plus real permaweb writes via the Arweave L1 transport.
arweave = ["cryptography>=44,<46", "arweave-python-client>=1.0,<2"]
# On-device embeddings (ONNX, no torch, no API key). The zero-friction install path:
# `pip install lbrain[local]` gives a working brain with no credential step and no
# text leaving the machine. 384-dim (bge-small-en-v1.5) vs 1536 hosted — fresh brains only.
local = ["fastembed>=0.3,<1"]
# Test runner. Separate from the runtime deps on purpose: `pip install lbrain`
# must stay small. CI installs `.[dev]` — a bare `pip install -e .` has no pytest,
# which is exactly how the first CI run failed.
dev = ["pytest>=7"]
# Call-when-needed cross-encoder reranker (search(..., rerank=True)). ONNX, no torch.
# sentence-transformers also works as a fallback if already installed.
rerank = ["fastembed>=0.3,<1"]

[project.scripts]
lbrain = "lbrain.cli:main"

# The Tier-2 archive registers through the SAME entry-point group any out-of-tree
# package uses (lbrain/plugins.py). It was previously imported by name inside a
# try/except in cli.py and mcp_server.py — a plugin system with one plugin name
# written into the host. Dogfooding the general mechanism is what keeps it
# working: if the group breaks, the archive commands vanish HERE rather than
# silently at a third party.
[project.entry-points."lbrain.plugins"]
archive = "lbrain.archive.cli:register"

[project.entry-points."lbrain.mcp_plugins"]
archive = "lbrain.archive.mcp:register"

[tool.setuptools]
packages = ["lbrain", "lbrain.archive", "lbrain.framework", "lbrain.modules"]

# The lair framework docs are the AUTHORING CONTRACT for the corpus this engine
# ranks over — garbage in, confidently-ranked garbage out. They previously lived
# in docs/ and shipped to nobody: the wheel carried zero markdown and the README
# link 404s against a private repo (A-408). They are package data now, so they
# install with the tool and are reachable at runtime via `lbrain framework`.
[tool.setuptools.package-data]
"lbrain.framework" = ["*.md"]
# Modules are content, so they are package data for the same reason the framework
# is: a module that does not install with the tool reaches nobody. The nested
# globs are the module layout (<name>/module.toml, <name>/questions/*.md).
"lbrain.modules" = ["*/*.toml", "*/*.md", "*/*/*.md"]

[project.urls]
Homepage = "https://lbrain.ai"
Source = "https://github.com/metavolve-labs/lbrain"
Issues = "https://github.com/metavolve-labs/lbrain/issues"
