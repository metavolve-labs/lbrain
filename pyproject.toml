[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrain"
version = "0.1.0"
description = "LBrain by Metavolve Labs — AI-native engineering memory with the Lair Protocol."
requires-python = ">=3.10"
authors = [{name = "Metavolve Labs, Inc."}]
license = {text = "BSD-3-Clause"}
dependencies = [
    "sqlite-vec>=0.1.6",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "click>=8.1",
    "tiktoken>=0.7",
    "rank-bm25>=0.2.2",
    "mcp>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
lbrain = "lbrain.cli:main"

[tool.setuptools]
packages = ["lbrain"]
