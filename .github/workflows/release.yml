# Publish to PyPI via Trusted Publishing (OIDC). No API token is stored anywhere.
#
# Why OIDC and not a token: a long-lived upload token is a credential that has to
# live somewhere, and "somewhere" is how credentials leak. This exchanges a
# short-lived GitHub identity for a scoped upload right at publish time. Nothing
# to store, nothing to rotate, nothing to find in git history later.
#
# The human gate is the `environment:` below, NOT a convention. Add required
# reviewers to the `pypi` environment in Settings → Environments and this job
# BLOCKS until a human approves it. That turns "never publish without approval"
# from a sentence in a doc into something the runner enforces.
#
# A version can never be reused on PyPI — only yanked. Tag deliberately.
name: Release

# DISPATCH-ONLY, deliberately. There is no `push: tags` trigger.
#
# The intended gate was the `pypi` environment's Required Reviewers. That rule is
# unavailable here: GitHub returns 422 "please ensure the billing plan supports the
# required reviewers protection rule" — it needs Enterprise on a private repo, and
# this org is on Team. Verified against the API, not assumed.
#
# So the gate is the trigger itself. With no tag trigger, publishing cannot happen
# as a side effect of pushing a tag; a human must open Actions and press Run
# workflow. That is approval-by-initiation instead of approval-by-review — weaker
# in that it is one person, stronger in that it cannot fire by accident, which is
# the failure that actually worries us. A version is burned forever on upload.
#
# If this org moves to Enterprise, add Required Reviewers to the `pypi` environment
# and a `push: tags` trigger can be restored safely.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the RELEASE-REQUIRES gate below runs merge-base
          # --is-ancestor, which is meaningless on a depth-1 clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to republish a version, and refuse an untagged one
        # Rewritten 2026-08-03. The first version of this step keyed on
        # GITHUB_REF_TYPE == tag — and once the tag trigger was removed to create a
        # human gate, it could never fire again. A guard that cannot run is worse
        # than no guard: it reads as protection in the diff and enforces nothing.
        # Same false-comfort shape as a green test run that collects no tests.
        #
        # Two checks that DO fire on a dispatch, both aimed at the irreversible part:
        #   1. the version is not already on PyPI  — an upload can never be undone,
        #      and a version number can never be reused, only yanked. This is the
        #      "you forgot to bump" catch.
        #   2. a matching git tag exists           — so the published artifact maps
        #      to a real commit. The absence of any tag is what made 0.1.1
        #      untraceable to a commit in the first place.
        run: |
          PKG="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "pyproject version: $PKG"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/lbrain/$PKG/json")
          if [ "$CODE" = "200" ]; then
            echo "::error::lbrain $PKG is ALREADY on PyPI. A version can never be reused — bump it."
            exit 1
          fi
          echo "  not yet on PyPI (HTTP $CODE) — ok to publish"

          # --force: when this workflow is dispatched ON the tag (the intended
          # path since AMBER-REL-2), checkout has already materialized the tag
          # ref locally and a plain --tags fetch refuses to clobber it — dying
          # under `set -e` with no message (observed run 33593710375).
          git fetch --tags --force --quiet
          if ! git rev-parse "v$PKG" >/dev/null 2>&1; then
            echo "::error::no git tag v$PKG. Tag the commit you are publishing so the artifact maps to it."
            exit 1
          fi
          echo "  tag v$PKG exists and points at $(git rev-parse --short "v$PKG")"

      - name: Refuse a release that does not CONTAIN its named fixes
        # Born 2026-09-02 (the 0.1.9.x lesson): the version being published must
        # be a descendant of every SHA in RELEASE-REQUIRES. Publishing main while
        # release-blocking work sits on a branch stops being possible.
        run: |
          TAG="v$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          # AMBER-REL-2 (CSO 2026-09-02): build builds HEAD of the dispatched ref,
          # so the tag containing the fixes proves nothing unless HEAD IS the tag —
          # otherwise artifacts don't match the commit their version names (the
          # 0.1.1 untraceability in modern dress). Dispatch ON the tag.
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::HEAD ($(git rev-parse --short HEAD)) is not $TAG ($(git rev-parse --short "$TAG^{commit}")) — dispatch this workflow on the tag itself."
            exit 1
          fi
          FAIL=0; VERIFIED=0
          # `; echo` immunizes against a future unterminated last line (CSO note 2).
          while read -r sha label; do
            case "$sha" in ''|'#'*) continue;; esac
            if git merge-base --is-ancestor "$sha" "$TAG" 2>/dev/null; then
              echo "  ✓ $TAG contains $sha ($label)"; VERIFIED=$((VERIFIED+1))
            else
              echo "::error::$TAG does NOT contain required fix $sha ($label) — this release would ship without its own guarantees."
              FAIL=1
            fi
          done < <(cat RELEASE-REQUIRES; echo)
          # An empty manifest passes but must READ as zero, not as coverage (CSO note 1).
          echo "  RELEASE-REQUIRES fixes verified: $VERIFIED"
          exit "$FAIL"

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: The framework docs must actually be in the wheel
        # A wheel built before the packaging fix had ZERO lbrain.framework entries
        # and still passed twine check. `twine check` validates metadata, not
        # contents — so this asserts the contents.
        run: |
          COUNT=$(python -c "
          import zipfile,glob
          w=sorted(glob.glob('dist/*.whl'))[-1]
          print(len([n for n in zipfile.ZipFile(w).namelist() if n.startswith('lbrain/framework/')]))")
          echo "lbrain/framework entries: $COUNT"
          [ "$COUNT" -ge 6 ] || { echo "::error::wheel is missing lbrain.framework — rebuild"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # ← add required reviewers here to gate on a human
    permissions:
      id-token: write          # ← the OIDC token. Trusted Publishing needs exactly this.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — that is the point. PyPI verifies the OIDC claim against
        # the publisher you registered (owner / repo / workflow / environment).
