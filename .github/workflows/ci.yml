name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ip-boundary:
    # The public engine REFUSES proprietary-mechanism code. lbrain is the memory
    # engine (BSD-3); the compaction mechanism stays in the private harness. This
    # gate makes that invariant something the repo enforces on every PR, not
    # something a contributor has to remember. See scripts/check-ip-boundary.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IP boundary
        run: bash scripts/check-ip-boundary.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # No network, no API key, no model download — the suite must pass cold.
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
