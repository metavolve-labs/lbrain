name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ip-boundary:
    # The public engine REFUSES proprietary-mechanism code. lbrain is the memory
    # engine (BSD-3); the compaction mechanism stays in the private harness. This
    # gate makes that invariant something the repo enforces on every PR, not
    # something a contributor has to remember. See scripts/check-ip-boundary.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IP boundary
        run: bash scripts/check-ip-boundary.sh

  model:
    # Downloads the local embedding model once per cache key, with retries, so the test matrix never races four
    # parallel downloads against the model host (2026-11-18).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the local embedding model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}
      - name: Download the model (three attempts)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -e ".[dev]"
          for i in 1 2 3; do
            python -c "from fastembed import TextEmbedding; import os; TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir='/tmp/fastembed_cache'); print('model ready')" && break
            echo "attempt $i failed; retrying in 20 s"; sleep 20
          done
          test -n "$(ls -A /tmp/fastembed_cache)"
  test:
    needs: model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 2026-11-18: the epoch tests run `lbrain embed` in staging and need the local model. Four matrix jobs each
      # downloading BAAI/bge-small-en-v1.5 in parallel is what flaked three of four jobs on 825a69b ("Could not load
      # model ... from any source", a different test each time; Farrier's log read). The `model` job below downloads
      # it once, with retries, into a cache the matrix restores here; a cache miss here still downloads as before.
      - name: Restore the local embedding model
        uses: actions/cache@v4
        with:
          # the engine seeds a fresh home's models/ from this legacy path when it holds the model (embed.py), so
          # no test needs an env override and the "cached under <home>/models" behaviour stays exercised
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # No API key. The only network the suite may touch is a model re-download on a cache miss above.
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
